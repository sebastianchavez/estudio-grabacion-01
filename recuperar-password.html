<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña · SoundLab Studio</title>
  <meta name="description" content="Recupera el acceso a tu cuenta de SoundLab Studio." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#ff6b35', 'primary-light': '#ffa07a', 'background-dark': '#0a0a0a', 'background-card': '#161616' },
          fontFamily: { display: ['Bebas Neue'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="recuperar" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="max-w-md mx-auto">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center h-16 w-16 rounded-full bg-primary/10 border border-primary/30 mb-4">
          <svg class="h-8 w-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-white mb-2" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">Recuperar contraseña</h1>
        <p class="text-gray-400" id="stepLabel">Te enviaremos un código para restablecer tu contraseña</p>
      </div>

      <div class="bg-background-card border border-gray-800 rounded-2xl p-8">
        <form id="stepEmail" class="space-y-5">
          <div>
            <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Email registrado</label>
            <input type="email" required id="emailInput" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" placeholder="tu@email.com" />
          </div>
          <button type="submit" class="btn-primary w-full">
            Enviar código de verificación
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
          </button>
        </form>

        <form id="stepCode" class="space-y-5 hidden">
          <div class="bg-primary/10 border border-primary/30 rounded-lg p-4 mb-2">
            <p class="text-sm text-primary">Código enviado a <span id="emailShown" class="font-bold"></span></p>
            <p class="text-xs text-gray-400 mt-1">Revisa tu bandeja de entrada (en esta demo, el código es <span id="codeShown" class="text-primary font-bold"></span>).</p>
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Código de verificación</label>
            <input type="text" required id="codeInput" maxlength="6" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none text-center text-2xl tracking-[0.5em] font-bold" />
          </div>
          <button type="submit" class="btn-primary w-full">
            Verificar código
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
          </button>
          <button type="button" id="resendCode" class="text-xs text-primary hover:text-primary-light transition-colors w-full text-center">Reenviar código</button>
        </form>

        <form id="stepPass" class="space-y-5 hidden">
          <div>
            <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Nueva contraseña</label>
            <input type="password" required id="newPass" minlength="6" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" placeholder="Mínimo 6 caracteres" />
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Confirmar contraseña</label>
            <input type="password" required id="confirmPass" minlength="6" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" placeholder="Repite la contraseña" />
          </div>
          <button type="submit" class="btn-primary w-full">
            Cambiar contraseña
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          </button>
        </form>

        <div class="mt-6 pt-6 border-t border-gray-800 text-center">
          <a href="inicio-sesion.html" class="text-sm text-primary hover:text-primary-light font-bold">Volver a iniciar sesión</a>
        </div>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    function pageInit() {
      const stepEmail = document.getElementById('stepEmail');
      const stepCode = document.getElementById('stepCode');
      const stepPass = document.getElementById('stepPass');
      const stepLabel = document.getElementById('stepLabel');
      let email = '';
      let generatedCode = '';

      function setStep(n) {
          [stepEmail, stepCode, stepPass].forEach(s => s.classList.add('hidden'));
          if (n === 1) { stepEmail.classList.remove('hidden'); stepLabel.textContent = 'Te enviaremos un código para restablecer tu contraseña'; }
          if (n === 2) { stepCode.classList.remove('hidden'); stepLabel.textContent = 'Ingresa el código que enviamos a tu email'; }
          if (n === 3) { stepPass.classList.remove('hidden'); stepLabel.textContent = 'Crea una nueva contraseña para tu cuenta'; }
      }

      stepEmail.addEventListener('submit', (e) => {
        e.preventDefault();
        email = document.getElementById('emailInput').value.trim();
        const users = Storage.get(STORAGE_KEYS.USERS, []);
        if (!users.find(u => u.email === email)) { UI.toast('Email no registrado.', 'error'); return; }
        generatedCode = String(Math.floor(100000 + Math.random() * 900000));
        document.getElementById('emailShown').textContent = email;
        document.getElementById('codeShown').textContent = generatedCode;
        UI.toast('Código enviado (revisa la caja de demo).');
        setStep(2);
      });

      document.getElementById('resendCode').addEventListener('click', () => {
        generatedCode = String(Math.floor(100000 + Math.random() * 900000));
        document.getElementById('codeShown').textContent = generatedCode;
        UI.toast('Nuevo código enviado.');
      });

      stepCode.addEventListener('submit', (e) => {
        e.preventDefault();
        const code = document.getElementById('codeInput').value.trim();
        if (code !== generatedCode) { UI.toast('Código incorrecto.', 'error'); return; }
        setStep(3);
      });

      stepPass.addEventListener('submit', (e) => {
        e.preventDefault();
        const np = document.getElementById('newPass').value;
        const cp = document.getElementById('confirmPass').value;
        if (np !== cp) { UI.toast('Las contraseñas no coinciden.', 'error'); return; }
        const res = Auth.resetPassword(email, np);
        if (!res.ok) { UI.toast(res.error, 'error'); return; }
        UI.toast('Contraseña actualizada correctamente.');
        setTimeout(() => window.location.href = 'inicio-sesion.html', 800);
      });
    }
  </script>
</body>
</html>
