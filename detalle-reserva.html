<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de reserva · SoundLab Studio</title>
  <meta name="description" content="Detalle completo de tu reserva en SoundLab Studio." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#ff6b35', 'primary-light': '#ffa07a', 'background-dark': '#0a0a0a', 'background-card': '#161616' },
          fontFamily: { display: ['Bebas Neue'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="detalle-reserva" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div id="detailRoot" class="max-w-4xl mx-auto">
      <a href="perfil.html" class="inline-flex items-center gap-2 text-gray-400 hover:text-primary transition-colors text-sm mb-6">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        Volver a mis reservas
      </a>

      <div class="bg-background-card border border-gray-800 rounded-2xl overflow-hidden mb-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-0">
          <img id="srvImg" src="" alt="" class="w-full h-64 md:h-full object-cover" />
          <div class="p-6 md:p-8">
            <div class="flex items-start justify-between gap-3 mb-3">
              <span id="srvCat" class="text-[10px] uppercase tracking-widest text-primary font-bold bg-primary/10 border border-primary/30 px-2 py-1 rounded">—</span>
              <div class="flex flex-col items-end gap-1">
                <span id="estadoBadge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold border">—</span>
                <span id="pagoBadge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold border">—</span>
              </div>
            </div>
            <p class="text-xs uppercase tracking-widest text-gray-500 mb-1">Reserva</p>
            <h1 id="srvNombre" class="text-3xl font-bold text-white mb-4" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">—</h1>
            <p id="srvDesc" class="text-gray-400 text-sm mb-4">—</p>
            <div class="border-t border-gray-800 pt-4 flex items-center justify-between">
              <span class="text-gray-400 text-sm">Total</span>
              <span id="srvPrecio" class="text-primary text-3xl font-bold" style="font-family: 'Bebas Neue', sans-serif;">—</span>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div class="bg-background-card border border-gray-800 rounded-2xl p-6">
          <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">
            <svg class="h-5 w-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            Fecha y hora
          </h3>
          <p id="fechaTxt" class="text-white font-bold text-lg mb-1">—</p>
          <p class="text-primary text-3xl font-bold mb-2" style="font-family: 'Bebas Neue', sans-serif;"><span id="horaTxt">—</span> hrs</p>
          <p class="text-gray-400 text-sm">Duración: <span id="duracionTxt">—</span></p>
        </div>
        <div class="bg-background-card border border-gray-800 rounded-2xl p-6">
          <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">
            <svg class="h-5 w-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            Profesional asignado
          </h3>
          <div class="flex items-center gap-4">
            <img id="profImg" src="" alt="" class="w-16 h-16 rounded-full object-cover border-2 border-primary/40" />
            <div class="flex-1">
              <p id="profNombre" class="text-white font-bold text-lg">—</p>
              <p id="profRol" class="text-primary text-xs uppercase tracking-wider font-bold">—</p>
              <div class="flex items-center gap-1 mt-1 text-xs">
                <span class="text-primary">★</span>
                <span id="profRating" class="text-white font-bold">—</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="notasBox" class="hidden bg-background-card border border-gray-800 rounded-2xl p-6 mb-6">
        <h3 class="text-lg font-bold text-white mb-3" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">Notas del proyecto</h3>
        <p id="notasTxt" class="text-gray-300 text-sm whitespace-pre-line">—</p>
      </div>

      <div id="pagoBox" class="hidden bg-background-card border border-gray-800 rounded-2xl p-6 mb-6">
        <h3 class="text-lg font-bold text-white mb-3" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">Información de pago</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
          <div>
            <p class="text-gray-400 text-xs uppercase tracking-wider mb-1">Estado</p>
            <p id="pagoEstadoTxt" class="text-white font-bold">—</p>
          </div>
          <div>
            <p class="text-gray-400 text-xs uppercase tracking-wider mb-1">Método</p>
            <p id="pagoMetodoTxt" class="text-white font-bold">—</p>
          </div>
          <div>
            <p class="text-gray-400 text-xs uppercase tracking-wider mb-1">ID reserva</p>
            <p id="reservaIdTxt" class="text-white font-mono">—</p>
          </div>
        </div>
      </div>

      <div class="bg-background-card border border-primary/20 rounded-2xl p-6">
        <h3 class="text-lg font-bold text-white mb-4" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">Acciones</h3>
        <div class="flex flex-wrap gap-3" id="accionesBox">
          <a href="pago.html?reserva=${id}" id="btnIrPago" class="btn-primary hidden">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
            Ir a pagar
          </a>
          <a href="contacto.html" class="btn-outline">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            Contactar al estudio
          </a>
          <button id="btnAnular" class="hidden bg-red-500/20 hover:bg-red-500/30 border border-red-500/40 text-red-300 font-bold py-3 px-5 rounded-lg transition-colors inline-flex items-center gap-2">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            Anular reserva
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    function pageInit() {
      if (!UI.requireAuth('detalle-reserva.html')) return;
      const id = UI.getQuery('id');
      const r = id ? Reservas.get(id) : null;
      if (!r) {
        document.getElementById('detailRoot').innerHTML = '<div class="bg-background-card border border-red-500/30 rounded-2xl p-8 text-center"><p class="text-red-400 mb-4">Reserva no encontrada.</p><a href="perfil.html" class="btn-outline">Volver</a></div>';
        return;
      }
      const user = Auth.current();
      if (r.userId !== user.id) {
        document.getElementById('detailRoot').innerHTML = '<div class="bg-background-card border border-red-500/30 rounded-2xl p-8 text-center"><p class="text-red-400 mb-4">No tienes permisos para ver esta reserva.</p><a href="perfil.html" class="btn-outline">Volver</a></div>';
        return;
      }

      const srv = UI.servicioById(r.servicioId);
      const prof = UI.profesionalById(r.profesionalId);
      const est = UI.estadoBadge(r.estado);
      const pag = UI.pagoBadge(r.pago);

      document.getElementById('srvImg').src = srv.imagen;
      document.getElementById('srvImg').alt = srv.nombre;
      document.getElementById('srvCat').textContent = UI.categoriaLabel(srv.categoria);
      document.getElementById('estadoBadge').className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-bold border ' + est.cls;
      document.getElementById('estadoBadge').textContent = est.label;
      document.getElementById('pagoBadge').className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-bold border ' + pag.cls;
      document.getElementById('pagoBadge').textContent = pag.label;
      document.getElementById('srvNombre').textContent = srv.nombre;
      document.getElementById('srvDesc').textContent = srv.descripcion;
      document.getElementById('srvPrecio').textContent = UI.formatPrice(r.precio);

      document.getElementById('fechaTxt').textContent = UI.formatDate(r.fecha);
      document.getElementById('horaTxt').textContent = r.hora;
      document.getElementById('duracionTxt').textContent = srv.duracion + ' minutos';

      document.getElementById('profImg').src = prof.foto;
      document.getElementById('profNombre').textContent = prof.nombre;
      document.getElementById('profRol').textContent = prof.rol;
      document.getElementById('profRating').textContent = prof.rating;

      if (r.notas && r.notas.trim()) {
        document.getElementById('notasBox').classList.remove('hidden');
        document.getElementById('notasTxt').textContent = r.notas;
      }

      document.getElementById('pagoBox').classList.remove('hidden');
      document.getElementById('pagoEstadoTxt').textContent = pag.label;
      const metodosLabel = { tarjeta: 'Tarjeta', transferencia: 'Transferencia', webpay: 'Webpay', mercadopago: 'MercadoPago' };
      document.getElementById('pagoMetodoTxt').textContent = r.metodoPago ? (metodosLabel[r.metodoPago] || r.metodoPago) : '—';
      document.getElementById('reservaIdTxt').textContent = '#' + r.id.toUpperCase();

      if (r.pago === 'pendiente' && r.estado !== 'anulada') {
        document.getElementById('btnIrPago').classList.remove('hidden');
        document.getElementById('btnIrPago').href = 'pago.html?reserva=' + r.id;
      }

      const past = UI.isPastDate(r.fecha);
      const canCancel = (r.estado === 'pendiente' || r.estado === 'confirmada') && !past;
      if (canCancel) document.getElementById('btnAnular').classList.remove('hidden');

      document.getElementById('btnAnular').addEventListener('click', () => {
        const m = UI.modal(`
          <div class="text-center">
            <div class="mx-auto h-14 w-14 rounded-full bg-red-500/20 border-2 border-red-500/40 flex items-center justify-center mb-4">
              <svg class="h-7 w-7 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-white mb-2" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">¿Anular esta reserva?</h3>
            <p class="text-gray-400 text-sm mb-6">Esta acción no se puede deshacer. Si anulas fuera de las 48 hrs previas, podrían aplicarse cargos según nuestras políticas.</p>
            <div class="flex gap-3 justify-center">
              <button class="btn-outline" data-close>Cancelar</button>
              <button id="confirmAnular" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-5 rounded-lg transition-colors">Sí, anular reserva</button>
            </div>
          </div>
        `);
        m.root.querySelector('#confirmAnular').addEventListener('click', () => {
          Reservas.cancel(r.id);
          UI.toast('Reserva anulada correctamente');
          setTimeout(() => window.location.reload(), 600);
        });
      });
    }
  </script>
</body>
</html>
