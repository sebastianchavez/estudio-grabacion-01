<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · SoundLab Studio</title>
  <meta name="description" content="Accede a tu cuenta de SoundLab Studio para ver tu historial de sesiones." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#ff6b35', 'primary-light': '#ffa07a', 'background-dark': '#0a0a0a', 'background-card': '#161616' },
          fontFamily: { display: ['Bebas Neue'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="login" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="max-w-md mx-auto">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center h-16 w-16 rounded-full bg-primary/10 border border-primary/30 mb-4">
          <svg class="h-8 w-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-white mb-2" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">Iniciar sesión</h1>
        <p class="text-gray-400">Bienvenido de vuelta a tu estudio</p>
      </div>

      <div class="bg-background-card border border-gray-800 rounded-2xl p-8">
        <form id="loginForm" class="space-y-5">
          <div>
            <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Email</label>
            <input type="email" required name="email" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" placeholder="tu@email.com" />
          </div>
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-xs uppercase tracking-wider text-gray-400">Contraseña</label>
              <a href="recuperar-password.html" class="text-xs text-primary hover:text-primary-light transition-colors">¿Olvidaste tu contraseña?</a>
            </div>
            <input type="password" required name="password" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" placeholder="••••••••" />
          </div>
          <div class="flex items-center gap-2">
              <input type="checkbox" id="remember" class="rounded border-gray-700 bg-background-dark text-primary focus:ring-primary" />
              <label for="remember" class="text-sm text-gray-400">Recordarme</label>
          </div>
          <button type="submit" class="btn-primary w-full">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
            Entrar
          </button>
        </form>

        <div class="mt-6 pt-6 border-t border-gray-800 text-center">
          <p class="text-gray-400 text-sm">¿No tienes cuenta? <a href="registro.html" class="text-primary hover:text-primary-light font-bold">Crear cuenta</a></p>
        </div>
      </div>

      <div class="mt-6 bg-background-card border border-primary/20 rounded-xl p-5">
        <p class="text-xs uppercase tracking-widest text-primary font-bold mb-3">Usuarios de prueba</p>
        <div class="space-y-2 text-xs text-gray-300">
          <div class="flex items-center gap-2">
            <span class="text-primary">●</span> juan@test.com / 123456
          </div>
          <div class="flex items-center gap-2">
            <span class="text-primary">●</span> maria@test.com / 123456
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    function pageInit() {
      if (Auth.isLogged()) {
        const r = Storage.get('sl_redirect', 'perfil.html');
        Storage.remove('sl_redirect');
        window.location.href = r;
        return;
      }
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const res = Auth.login(fd.get('email').trim(), fd.get('password'));
        if (!res.ok) { UI.toast(res.error, 'error'); return; }
        UI.toast('Bienvenido ' + res.user.nombre.split(' ')[0]);
        const r = Storage.get('sl_redirect', 'perfil.html');
        Storage.remove('sl_redirect');
        setTimeout(() => window.location.href = r, 600);
      });
    }
  </script>
</body>
</html>
