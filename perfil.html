<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi perfil · SoundLab Studio</title>
  <meta name="description" content="Gestiona tus datos y revisa tu historial de reservas en SoundLab Studio." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#ff6b35', 'primary-light': '#ffa07a', 'background-dark': '#0a0a0a', 'background-card': '#161616' },
          fontFamily: { display: ['Bebas Neue'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="perfil" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <aside class="lg:col-span-1 space-y-6">
        <div class="bg-background-card border border-gray-800 rounded-2xl p-6 text-center">
          <div class="relative inline-block mb-4">
            <img id="userFoto" src="" class="h-28 w-28 rounded-full object-cover border-4 border-primary/40 mx-auto" alt="" />
              <label for="fotoInput" class="absolute bottom-0 right-0 h-9 w-9 rounded-full bg-primary text-black flex items-center justify-center cursor-pointer hover:bg-primary-light transition-colors">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              </label>
              <input id="fotoInput" type="file" accept="image/*" class="hidden" />
            </div>
            <h2 id="userNombre" class="text-2xl font-bold text-white mb-1" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">—</h2>
            <p id="userEmail" class="text-gray-400 text-sm mb-4">—</p>
            <div class="grid grid-cols-3 gap-3 pt-4 border-t border-gray-800">
              <div>
                <p id="statTotal" class="text-2xl font-bold text-primary" style="font-family: 'Bebas Neue', sans-serif;">0</p>
                <p class="text-[10px] uppercase tracking-wider text-gray-500 mt-1">Total</p>
              </div>
              <div>
                <p id="statActivas" class="text-2xl font-bold text-primary" style="font-family: 'Bebas Neue', sans-serif;">0</p>
                <p class="text-[10px] uppercase tracking-wider text-gray-500 mt-1">Activas</p>
              </div>
              <div>
                <p id="statCompletadas" class="text-2xl font-bold text-primary" style="font-family: 'Bebas Neue', sans-serif;">0</p>
                <p class="text-[10px] uppercase tracking-wider text-gray-500 mt-1">Completadas</p>
              </div>
            </div>
          </div>

          <div class="bg-background-card border border-gray-800 rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">Datos personales</h3>
            <form id="perfilForm" class="space-y-4">
              <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Nombre</label>
                <input type="text" required name="nombre" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Email</label>
                <input type="email" required name="email" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Teléfono</label>
                <input type="tel" required name="telefono" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" />
              </div>
              <div class="border-t border-gray-800 pt-4">
                <p class="text-xs uppercase tracking-wider text-primary font-bold mb-3">Cambiar contraseña</p>
                <div class="space-y-3">
                  <input type="password" name="current" placeholder="Contraseña actual" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" />
                  <input type="password" name="new" placeholder="Nueva contraseña" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" />
                </div>
              </div>
              <button type="submit" class="btn-primary w-full">Guardar cambios</button>
            </form>
          </div>
        </aside>

        <section class="lg:col-span-2">
          <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
            <div>
              <p class="text-primary uppercase tracking-[0.3em] text-xs mb-1 font-medium">Historial</p>
              <h1 class="text-3xl md:text-4xl font-bold text-white" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">Mis reservas</h1>
            </div>
            <a href="reserva.html" class="btn-primary text-sm">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
              Nueva reserva
            </a>
          </div>

          <div class="flex flex-wrap gap-2 mb-6" id="filterEstado">
            <button class="chip active" data-estado="todas">Todas</button>
            <button class="chip" data-estado="pendiente">Pendientes</button>
            <button class="chip" data-estado="confirmada">Confirmadas</button>
            <button class="chip" data-estado="pagada">Pagadas</button>
            <button class="chip" data-estado="completada">Completadas</button>
            <button class="chip" data-estado="anulada">Anuladas</button>
          </div>

          <div id="reservasList" class="space-y-4"></div>
        </section>
      </div>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    function pageInit() {
      if (!UI.requireAuth('perfil.html')) return;

      const user = Auth.current();
      let currentFoto = user.foto;
      let currentEstado = 'todas';

      function loadHeader() {
        document.getElementById('userNombre').textContent = user.nombre;
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userFoto').src = currentFoto;
        const f = document.getElementById('perfilForm');
        f.nombre.value = user.nombre;
        f.email.value = user.email;
        f.telefono.value = user.telefono;
      }

      function loadStats() {
        const list = Reservas.listByUser(user.id);
        document.getElementById('statTotal').textContent = list.length;
        document.getElementById('statActivas').textContent = list.filter(r => ['pendiente','confirmada','pagada'].includes(r.estado)).length;
        document.getElementById('statCompletadas').textContent = list.filter(r => r.estado === 'completada').length;
      }

      function renderReservas() {
        const list = Reservas.listByUser(user.id).sort((a,b) => b.createdAt - a.createdAt);
        const filtered = currentEstado === 'todas' ? list : list.filter(r => r.estado === currentEstado);
        const host = document.getElementById('reservasList');
        if (filtered.length === 0) {
          host.innerHTML = `
            <div class="bg-background-card border border-gray-800 rounded-2xl p-10 text-center">
              <svg class="h-16 w-16 text-gray-700 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <p class="text-gray-400 mb-4">No tienes reservas ${currentEstado === 'todas' ? 'aún' : 'en este estado'}.</p>
              <a href="reserva.html" class="btn-primary">Crear mi primera reserva</a>
            </div>
          `;
          return;
        }
        host.innerHTML = filtered.map(r => {
          const srv = UI.servicioById(r.servicioId);
          const prof = UI.profesionalById(r.profesionalId);
          const est = UI.estadoBadge(r.estado);
          const pag = UI.pagoBadge(r.pago);
          const past = UI.isPastDate(r.fecha);
          return `
            <a href="detalle-reserva.html?id=${r.id}" class="card-hover block bg-background-card border border-gray-800 rounded-2xl overflow-hidden">
              <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 p-5">
                <img src="${srv.imagen}" alt="${srv.nombre}" class="w-full sm:w-24 h-24 rounded-lg object-cover" />
                <div class="sm:col-span-2 flex flex-col justify-center">
                  <p class="text-xs uppercase tracking-widest text-primary font-bold mb-1">${UI.categoriaLabel(srv.categoria)}</p>
                  <h3 class="text-lg font-bold text-white mb-1">${srv.nombre}</h3>
                  <div class="flex items-center gap-3 text-sm text-gray-400 flex-wrap">
                    <span class="flex items-center gap-1">
                      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                      ${UI.formatDate(r.fecha)}
                    </span>
                    <span class="flex items-center gap-1">
                      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                      ${r.hora} hrs · ${srv.duracion} min
                    </span>
                    <span class="flex items-center gap-1">
                      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                      ${prof.nombre}
                    </span>
                  </div>
                  ${past && r.estado !== 'anulada' && r.estado !== 'completada' ? '<p class="text-xs text-yellow-400 mt-2 italic">Sesión ya pasada</p>' : ''}
                </div>
                <div class="flex flex-col items-end justify-center gap-2">
                  <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold border ${est.cls}">${est.label}</span>
                  <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold border ${pag.cls}">${pag.label}</span>
                  <p class="text-primary text-2xl font-bold mt-1" style="font-family: 'Bebas Neue', sans-serif;">${UI.formatPrice(r.precio)}</p>
                </div>
              </div>
            </a>
          `;
        }).join('');
      }

      loadHeader();
      loadStats();
      renderReservas();

      document.getElementById('fotoInput').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => {
          currentFoto = ev.target.result;
          document.getElementById('userFoto').src = currentFoto;
        };
        reader.readAsDataURL(f);
      });

      document.getElementById('perfilForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = { nombre: fd.get('nombre').trim(), email: fd.get('email').trim(), telefono: fd.get('telefono').trim() };
        if (currentFoto !== user.foto) data.foto = currentFoto;
        const cur = fd.get('current');
        const neu = fd.get('new');
        if (neu) {
          if (!cur || cur !== user.password) { UI.toast('La contraseña actual no es correcta.', 'error'); return; }
          data.password = neu;
        }
        const res = Auth.update(user.id, data);
        if (res.ok) {
          const s = Storage.get(STORAGE_KEYS.SESSION);
          Storage.set(STORAGE_KEYS.SESSION, { ...s, userId: res.user.id });
          UI.toast('Datos actualizados correctamente.');
          setTimeout(() => window.location.reload(), 500);
        }
      });

      document.querySelectorAll('[data-estado]').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('[data-estado]').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          currentEstado = b.dataset.estado;
          renderReservas();
        });
      });
    }
  </script>
</body>
</html>
