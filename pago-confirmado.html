<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago confirmado · SoundLab Studio</title>
  <meta name="description" content="Tu pago ha sido procesado exitosamente." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#ff6b35', 'primary-light': '#ffa07a', 'background-dark': '#0a0a0a', 'background-card': '#161616' },
          fontFamily: { display: ['Bebas Neue'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="pago-confirmado" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="max-w-2xl mx-auto">
      <div class="text-center mb-10">
        <div class="checkmark-circle mx-auto mb-6">
          <div class="background"></div>
          <div class="checkmark"></div>
        </div>
        <p class="text-primary uppercase tracking-[0.3em] text-xs mb-2 font-bold">¡Pago exitoso!</p>
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-3" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">Pago confirmado</h1>
        <p class="text-gray-300 mb-2">Hemos procesado tu pago correctamente. Tu sesión está asegurada.</p>
        <p class="text-gray-400 text-sm">N° de operación: <span id="operacion" class="text-primary font-bold">—</span></p>
      </div>

      <div class="bg-background-card border border-gray-800 rounded-2xl overflow-hidden mb-8" id="reciboBox">
      </div>

      <div class="bg-primary/10 border border-primary/30 rounded-2xl p-6 mb-8">
        <div class="flex items-start gap-3">
          <svg class="h-6 w-6 text-primary flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          <div>
            <p class="text-white font-bold mb-1">Confirmación enviada</p>
            <p class="text-gray-300 text-sm">Te enviamos un email con todos los detalles de tu reserva. Si tienes dudas, escríbenos a hola@soundlab.cl.</p>
          </div>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-4 justify-center no-print">
        <button onclick="window.print()" class="btn-outline">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          Imprimir recibo
        </button>
        <a href="perfil.html" class="btn-primary">
          Ver mi perfil
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
        </a>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    function pageInit() {
      const id = UI.getQuery('reserva');
      const r = id ? Reservas.get(id) : null;
      if (!r) { window.location.href = 'index.html'; return; }

      const op = 'OP-' + Date.now().toString().slice(-10);
      document.getElementById('operacion').textContent = op;

      const srv = UI.servicioById(r.servicioId);
      const prof = UI.profesionalById(r.profesionalId);
      const user = Auth.current();
      const pago = Reservas.getPagoDraft() || {};
      const metodoLabel = { tarjeta: 'Tarjeta de crédito/débito', transferencia: 'Transferencia bancaria', webpay: 'Webpay', mercadopago: 'MercadoPago' }[pago.metodo] || r.metodoPago || '—';
      const fechaPago = pago.fechaPago ? new Date(pago.fechaPago).toLocaleString('es-CL') : new Date().toLocaleString('es-CL');

      document.getElementById('reciboBox').innerHTML = `
        <div class="p-6 border-b border-gray-800 flex items-center justify-between">
          <div>
            <h3 class="text-xl font-bold text-white" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em;">Recibo de pago</h3>
            <p class="text-gray-500 text-xs">SoundLab Studio · Santiago, Chile</p>
          </div>
          <div class="text-right">
            <p class="text-xs text-gray-500">Emitido</p>
            <p class="text-white text-sm font-semibold">${fechaPago}</p>
          </div>
        </div>
        <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-5 text-sm">
          <div>
            <p class="text-xs uppercase tracking-widest text-gray-500 mb-1">Cliente</p>
            <p class="text-white font-bold">${user.nombre}</p>
            <p class="text-gray-400 text-xs">${user.email}</p>
            <p class="text-gray-400 text-xs">${user.telefono}</p>
          </div>
          <div>
            <p class="text-xs uppercase tracking-widest text-gray-500 mb-1">Detalle reserva</p>
            <p class="text-white font-bold">#${r.id.toUpperCase()}</p>
            <p class="text-gray-400 text-xs">${srv.nombre}</p>
            <p class="text-gray-400 text-xs">${UI.formatDate(r.fecha)} · ${r.hora} hrs</p>
          </div>
          <div>
            <p class="text-xs uppercase tracking-widest text-gray-500 mb-1">Profesional</p>
            <p class="text-white font-bold">${prof.nombre}</p>
            <p class="text-primary text-xs uppercase tracking-wider font-bold">${prof.rol}</p>
          </div>
          <div>
            <p class="text-xs uppercase tracking-widest text-gray-500 mb-1">Método de pago</p>
            <p class="text-white font-bold">${metodoLabel}</p>
          </div>
        </div>
        <div class="px-6 py-4 bg-primary/10 border-t border-primary/30 flex items-center justify-between">
          <span class="text-white font-bold">Total pagado</span>
          <span class="text-primary text-3xl font-bold" style="font-family: 'Bebas Neue', sans-serif;">${UI.formatPrice(r.precio)}</span>
        </div>
      `;

      Reservas.clearPagoDraft();
    }
  </script>
</body>
</html>
